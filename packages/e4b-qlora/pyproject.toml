[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e4b-qlora"
version = "0.1.1"
description = "Alias for experts4bit-qlora (lookup name; install experts4bit-qlora): Train and serve Mixture-of-Experts models that do not fit in VRAM: fused 4-bit experts, QLoRA, CPU/NVMe offload, and fast inference on consumer NVIDIA GPUs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jordan Anderson", email = "paul.jordan.anderson@gmail.com" }]
keywords = ["experts4bit", "e4b", "bitsandbytes", "qlora", "moe", "mixture-of-experts", "quantization", "nf4", "alias"]
# The point: installing this pulls in the real distribution. Floor (not ==) so
# the alias keeps tracking experts4bit-qlora as it releases.
dependencies = [
    "experts4bit-qlora>=0.2.0",
]

# Extras forward to the real package's extras.
[project.optional-dependencies]
fast = ["experts4bit-qlora[fast]>=0.2.0"]
train = ["experts4bit-qlora[train]>=0.2.0"]
serve = ["experts4bit-qlora[serve]>=0.2.0"]
test = ["experts4bit-qlora[test]>=0.2.0"]

[project.urls]
Homepage = "https://github.com/pjordanandrsn/experts4bit-qlora"
Documentation = "https://github.com/pjordanandrsn/experts4bit-qlora/blob/main/docs/SOLUTIONS.md"
Source = "https://github.com/pjordanandrsn/experts4bit-qlora"
Issues = "https://github.com/pjordanandrsn/experts4bit-qlora/issues"
"Canonical package (experts4bit-qlora)" = "https://pypi.org/project/experts4bit-qlora/"


[tool.setuptools.packages.find]
include = ["e4b_qlora*"]
